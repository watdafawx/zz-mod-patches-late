[mod-setting-name]
mod-patches-keep-spoiling=Keep spoiling (Whats a Spoilage exceptions)
mod-patches-static-menu=Static main menu (no simulations)
mod-patches-hide-made-in=Hide from "Made in" lists

[mod-setting-description]
mod-patches-keep-spoiling=Items that keep spoiling normally while Whats a Spoilage is on. Comma or space separated:\n  item-name  exact item\n  prefix-*  every item whose name starts with prefix-\n  @mod-name  every item whose icon comes from that mod (e.g. @slag-pit)
mod-patches-hide-made-in=Machines left out of the "Made in" list of recipe tooltips and Factoriopedia (they still work and can still be built). Same syntax as above:\n  machine-name  exact machine\n  prefix-*  every machine whose name starts with prefix-\n  @mod-name  every machine whose icon comes from that mod\nThe default hides the Bioluminescent and Harene-infused copies of machines, plus the niche Hephaestus specialty assemblers and the Algite assembler.
mod-patches-static-menu=Removes every main-menu simulation (vanilla, Space Age and mods) so the menu shows a still image. Pick the image with Krastorio 2's "Main menu background" setting; without Krastorio it is the base-game background.
